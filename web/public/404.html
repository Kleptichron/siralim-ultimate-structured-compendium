<!doctype html>
<!-- Served by GitHub Pages for any path that is not the app. Self-contained
     on purpose: a 404 can be served at any depth, so relative asset paths
     cannot be trusted — and a page whose job is "you took a wrong turn"
     should not have its own ways to break. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#14161a">
  <title>Not found — SU Structured Compendium</title>
  <style>
    body {
      margin: 0; background: #14161a; color: #d8dce5;
      font: 1rem/1.5 system-ui, 'Segoe UI', sans-serif;
      display: grid; place-items: center; min-height: 100vh;
    }
    main {
      max-width: 46ch; padding: 22px 24px;
      background: #1c1f26; border: 1px solid #30343e; border-radius: 8px;
    }
    h1 { margin: 0 0 8px; font-size: 1.15rem; color: #35a7ad; }
    p { margin: 0 0 8px; }
    a { color: #35a7ad; }
  </style>
</head>
<body>
  <main>
    <h1>There's nothing at this address.</h1>
    <p>The compendium is one page — every search, filter and effect permalink
      lives after the <code>#</code> in its URL.</p>
    <p><a href="https://kleptichron.github.io/siralim-ultimate-structured-compendium/">Go to the compendium</a></p>
  </main>
</body>
</html>
