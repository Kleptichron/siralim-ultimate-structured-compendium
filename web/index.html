<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Siralim Ultimate Structured Compendium</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header>
    <h1>SU Structured Compendium</h1>
    <input id="search" type="search" placeholder="Search text and names… ( / )" autocomplete="off">
    <span id="coverage" class="dim"></span>
  </header>
  <div id="boot" role="status" aria-live="polite">
    <div class="boot-msg">Loading compendium…</div>
    <div class="boot-track"><div class="boot-bar"></div></div>
    <div class="boot-sub"></div>
  </div>
  <div class="layout">
    <aside id="facets"></aside>
    <main>
      <div id="resultbar" class="dim"></div>
      <div id="results"></div>
      <div id="more"></div>
    </main>
  </div>
  <script type="module" src="/main.js"></script>
</body>
</html>
