<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Siralim Ultimate Structured Compendium</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <!-- Buttons, not anchors: the hash is the search state, so href="#results"
       would wipe the query it is trying to skip you to. -->
  <button class="skip" type="button" data-skip="#results">Skip to results</button>
  <button class="skip" type="button" data-skip="#facetsinner">Skip to filters</button>
  <header>
    <button id="navtoggle" type="button" aria-controls="facets" aria-expanded="true">
      <span class="bars" aria-hidden="true"></span><span class="navlabel">Filters</span><span id="navcount"></span>
    </button>
    <h1>SU Structured Compendium</h1>
    <input id="search" type="search" placeholder="Search names, creatures, effect text… ( / )" autocomplete="off">
    <button id="buildtoggle" type="button">Build</button>
    <span id="coverage" class="dim"></span>
  </header>
  <!-- One suggestion list per slot rule, so a slot only ever offers traits it
       can actually take. Innate and Fusion share the creature list. -->
  <datalist id="traitnames"></datalist>
  <datalist id="traitnames-creature"></datalist>
  <datalist id="traitnames-artifact"></datalist>
  <div id="backdrop" hidden></div>
  <!-- Confirmations that are otherwise only visible in a button label. -->
  <div id="say" class="sr-only" role="status" aria-live="polite"></div>
  <div id="addmenu" hidden role="dialog" aria-label="Add trait to build"></div>
  <div id="xmenu" hidden role="menu" aria-label="Export results" data-roving></div>
  <div id="boot" role="status" aria-live="polite">
    <div class="boot-msg">Loading compendium…</div>
    <div class="boot-track"><div class="boot-bar"></div></div>
    <div class="boot-sub"></div>
  </div>
  <div class="layout">
    <aside id="facets"><div class="facets-inner" id="facetsinner" tabindex="-1"></div></aside>
    <main>
      <div id="resultbar" class="dim"></div>
      <!-- tabindex="-1": these are the regions focus falls back to when the
           control that was focused no longer exists after a re-render. -->
      <div id="activefilters" tabindex="-1"></div>
      <div id="results" tabindex="-1"></div>
      <div id="more" tabindex="-1"></div>
      <div id="build" hidden></div>
    </main>
  </div>
  <script type="module" src="/main.js"></script>
</body>
</html>
